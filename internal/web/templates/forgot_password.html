{{define "content"}}
<div class="row justify-content-center" style="margin-top: 10vh;">
  <div class="col-md-5 col-lg-4">
    <div class="card login-card shadow-sm">
      <div class="card-body">
        <h3 class="card-title text-center mb-1">Reset your password</h3>
        <p class="text-center text-muted small mb-4">Enter your username and we'll email you a reset link</p>
        {{if .Error}}
          <div class="alert alert-danger">{{.Error}}</div>
        {{end}}
        {{if .Success}}
          <div class="alert alert-success">{{.Success}}</div>
        {{end}}
        {{if not .Success}}
          <form method="POST" action="/forgot-password">
            {{template "csrfField" .}}
            <div class="mb-3">
              <label for="username" class="form-label">Username {{template "requiredIndicator" .}}</label>
              <input type="text" class="form-control" id="username" name="username" required autofocus autocomplete="username" value="{{if .FormData}}{{.FormData.Username}}{{end}}">
            </div>
            <button type="submit" class="btn btn-dark w-100">Email Reset Link</button>
          </form>
          <div class="text-center mt-3">
            <a href="/login" class="small">Back to login</a>
          </div>
        {{else}}
          <div class="text-center mt-3">
            <a href="/login" class="small">Back to login</a>
          </div>
        {{end}}
      </div>
    </div>
  </div>
</div>
{{end}}
