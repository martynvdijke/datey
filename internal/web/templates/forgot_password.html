{{define "content"}}
<div class="auth-shell">
  <div class="card login-card shadow-sm">
    <div class="card-body">
      <div class="auth-brand" aria-hidden="true"><span class="brand-icon">D</span></div>
      <h1 class="card-title text-center mb-1">Reset your password</h1>
      <p class="text-center text-muted small mb-4">Enter your username and we'll email you a reset link</p>

      {{if .Error}}
        <div class="auth-alert" id="reset-error" role="alert">
          <span class="auth-alert-icon" aria-hidden="true">!</span>
          <span>{{.Error}}</span>
        </div>
      {{end}}
      {{if .Success}}
        <div class="auth-alert auth-alert-success" role="status">
          <span class="auth-alert-icon" aria-hidden="true">&#10003;</span>
          <span>{{.Success}}</span>
        </div>
      {{end}}

      {{if not .Success}}
        <form method="POST" action="/forgot-password">
          {{template "csrfField" .}}
          <div class="mb-4">
            <label for="username" class="form-label">Username {{template "requiredIndicator" .}}</label>
            <input type="text" class="form-control" id="username" name="username" required autofocus
                   autocomplete="username" autocapitalize="none" spellcheck="false"
                   placeholder="e.g. jane"
                   value="{{if .FormData}}{{.FormData.Username}}{{end}}"
                   {{if .Error}}aria-invalid="true" aria-describedby="reset-error"{{end}}>
          </div>
          <button type="submit" class="btn btn-dark w-100">Email Reset Link</button>
        </form>
      {{end}}

      <div class="auth-links">
        <a href="/login">Back to login</a>
      </div>

      {{template "authVersionFooter" .}}
    </div>
  </div>
</div>
{{end}}
