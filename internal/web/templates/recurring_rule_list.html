{{define "content"}}
<h1>Recurring Rules</h1>
<a href="/recurring-rules/new" class="btn btn-primary mb-3">New Rule</a>
<ul>
{{range .Rules}}<li>
  {{.Name}} ({{.PatternType}}) &mdash; {{.Date.Format "2006-01-02"}}
  <form action="/recurring-rules/{{.ID}}/delete" method="POST" style="display:inline">
    {{template "csrfField" $}}
    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
  </form>
</li>{{end}}
</ul>
{{end}}
