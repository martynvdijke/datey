{{define "content"}}
<div class="auth-shell">
  <div class="card login-card shadow-sm">
    <div class="card-body">
      <div class="auth-brand" aria-hidden="true"><span class="brand-icon">D</span></div>
      <h1 class="card-title text-center mb-1">Welcome to Datey</h1>
      <p class="text-center text-muted small mb-4">Set up your administrator account to get started.</p>

      {{if .Error}}
        <div class="auth-alert" id="setup-error" role="alert">
          <span class="auth-alert-icon" aria-hidden="true">!</span>
          <span>{{.Error}}</span>
        </div>
      {{end}}

      <form method="POST" action="/setup">
        {{template "csrfField" .}}
        <div class="mb-3">
          <label for="username" class="form-label">Username {{template "requiredIndicator" .}}</label>
          <input type="text" class="form-control" id="username" name="username" required autofocus
                 autocomplete="username" autocapitalize="none" spellcheck="false"
                 placeholder="e.g. jane"
                 value="{{if .FormData}}{{.FormData.Username}}{{end}}"
                 {{if .Error}}aria-describedby="setup-error"{{end}}>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password {{template "requiredIndicator" .}}</label>
          <input type="password" class="form-control" id="password" name="password" required minlength="8"
                 autocomplete="new-password" placeholder="Your password"
                 aria-describedby="setup-password-help{{if .Error}} setup-error{{end}}">
          <div class="form-text" id="setup-password-help">Must be at least 8 characters</div>
        </div>
        <button type="submit" class="btn btn-dark w-100">Create Admin Account</button>
      </form>

      {{template "authVersionFooter" .}}
    </div>
  </div>
</div>
{{end}}
