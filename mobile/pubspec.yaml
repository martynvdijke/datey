name: datey
description: Datey — birthdays, anniversaries, and gift ideas.
publish_to: 'none'
version: 1.53.2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  go_router: ^18.0.0
  cached_network_image: ^4.0.0
  flutter_secure_storage: ^11.0.0
  url_launcher: ^6.2.6
  webview_flutter: ^4.14.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# `path_provider_android` >= 2.3.0 pulls in the `jni` package, whose native build
# targets the legacy `armeabi` ABI. The Android NDK r28 removed `armeabi` support,
# so `flutter build apk --release` fails with:
#   "armeabi is no longer supported. Use armeabi-v7a."
# Pin to the last jni-free 2.2.x release (functionally equivalent for our usage).
dependency_overrides:
  path_provider_android: 2.2.23
