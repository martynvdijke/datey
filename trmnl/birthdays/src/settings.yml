---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language:
polling_url: "{{url}}/api/trmnl/birthdays"
polling_headers: "Authorization: Bearer {{key}}"
polling_body: ''
id: 443906
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: url
  field_type: url
  name: Address of Datey instance
  description: The base URL of your Datey instance
  placeholder: https://datey.example.com
  help_text: Please include http:// or https:// — the plugin polls <url>/api/trmnl/birthdays
- keyname: key
  field_type: password
  name: TRMNL device token
  description: Per-device API token created in Datey under Settings → API Tokens
  placeholder: Paste the token shown once at creation
  help_text: Create one token per display, then rotate or revoke it in Datey without affecting other devices. Legacy shared keys also work.
- keyname: bio
  name: About This Plugin
  category: entertainment
  field_type: author_bio
  description: I am running a Datey instance to keep track of birthdays, this shows the upcoming birthdays with ages on my trmnl.
  github_url: https://github.com/martynvdijke/datey
  learn_more_url: https://github.com/martynvdijke/datey
  email_address: martyn@vandijke.xyz
name: Datey Birthdays
description: Upcoming birthdays with ages.
refresh_interval: 1440
