polling_headers: ''
polling_body: ''
id: 443905
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: url
  field_type: url
  name: Address of Datey instance
  description: The base URL of your Datey instance
  placeholder: https://datey.example.com
  help_text: Please include http:// or https:// — the plugin polls <url>/api/trmnl/stats
- keyname: bio
  name: About This Plugin
  category: entertainment
  field_type: author_bio
